[package]
name = "checkrpmkeys"
version = "0.5.0"
edition = "2024"
authors = ["rawar089"]
license = "GPL-3"

[dependencies]
sequoia-openpgp = { version = "2.4.1", default-features = false, features = ["crypto-rust", "compression",
    "allow-experimental-crypto", "allow-variable-time-crypto"]}
chrono = "0.4.45"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.33"
clap = { version = "4.6.6", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29"
arboard = "3.6.1"
base64 = "0.23.1"
anyhow = "1"
